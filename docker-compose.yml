# Everything:       docker compose --env-file backend/.env up -d --build
# Database only:    docker compose --env-file backend/.env up -d db
# No credential defaults here on purpose: values come from backend/.env (gitignored).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: research-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:?PG_USER is not set}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is not set}
      POSTGRES_DB: ${PG_DATABASE:?PG_DATABASE is not set}
    ports:
      - "127.0.0.1:${PG_PORT:?PG_PORT is not set}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    container_name: research-assistant-api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - backend/.env
    environment:
      # Inside the compose network the database is reachable as "db" on its internal port.
      PG_HOST: db
      PG_PORT: "5432"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - models:/models

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: research-assistant-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pgdata:
  models:
